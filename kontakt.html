<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt – TBY Group</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav id="navbar" class="scrolled">
  <a href="index.html" class="nav-brand">TBY<span> Group</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Start</a></li>
    <li><a href="kontakt.html">Kontakt</a></li>
    <li><a href="impressum.html">Impressum</a></li>
  </ul>
</nav>
<main>
  <div class="page-content">
    <h1>Kontakt</h1>
    <p class="subtitle">Fragen, Feedback oder Support – schreib uns einfach.</p>
    <h2>E-Mail</h2>
    <p><a href="mailto:contact@tby-group.com">contact@tby-group.com</a></p>
    <form class="contact-form" action="mailto:contact@tby-group.com" method="post" enctype="text/plain" style="margin-top:2rem;">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Dein Name" required />
      </div>
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" placeholder="deine@email.de" required />
      </div>
      <div class="form-group">
        <label for="message">Nachricht</label>
        <textarea id="message" name="message" placeholder="Deine Nachricht..." required></textarea>
      </div>
      <button type="submit" class="btn">Nachricht senden</button>
    </form>
  </div>
</main>
<footer>
  <p><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="kontakt.html">Kontakt</a></p>
  <p style="margin-top:0.75rem;">TBY Group &copy; 2026. Alle Rechte vorbehalten.</p>
</footer>
</body>
</html>
